name: RTX 5090 FE Spain Watch

on:
  push:
    branches: [main]
  schedule:
    # Cron is only a watchdog. The active watcher self-dispatches a replacement.
    # Offset from :00 to reduce GitHub scheduler contention.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: rtx-5090-fe-spain-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A run stays alive for several smart/adaptive checks, then hands off to a
      # replacement run. The Python code chooses the actual delay each cycle.
      CHECKS_PER_RUN: "7"

      # Normal OOS: ~45s +/- jitter. After long stable OOS, slow down a little.
      SMART_BASE_SECONDS: "45"
      SMART_JITTER_SECONDS: "12"
      SMART_STABLE_SECONDS: "65"
      SMART_STABLE_AFTER: "8"

      # Backend/SKU signal: temporary faster polling, still jittered.
      SMART_BURST_SECONDS: "24"
      SMART_BURST_JITTER: "6"
      SMART_BURST_CYCLES: "8"

      # 403/429/errors: exponential circuit-breaker cooldown, capped at 15 min.
      SMART_MAX_COOLDOWN: "900"

      # Product-search is lighter than page HTML and keeps SKU fresh.
      DISCOVERY_EVERY_CHECKS: "3"
      PAGE_EVERY_CHECKS: "7"

    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4

      - name: Watch NVIDIA Spain RTX 5090 FE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tracker.py

      - name: Start replacement watcher
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/rtx5090-watch.yml/dispatches" \
            -d '{"ref":"main"}'
