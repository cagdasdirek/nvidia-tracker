name: RTX 5090 FE Spain Watch

on:
  push:
    branches: [main]
  schedule:
    # Cron is only a watchdog. The active watcher self-dispatches a replacement.
    # Offset from :00 to reduce GitHub scheduler contention.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: rtx-5090-fe-spain-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A run stays alive for several adaptive checks, then hands off to a
      # replacement run. adaptive_runner.py chooses the actual delay each cycle.
      CHECKS_PER_RUN: "7"

      # Core tracker state transitions.
      SMART_STABLE_AFTER: "8"
      SMART_BURST_CYCLES: "8"
      SMART_MAX_COOLDOWN: "900"

      # Non-periodic load-smoothed timing windows.
      # Ordinary OOS: bounded right-skewed samples, roughly 28-95s.
      TIMING_NORMAL_MIN: "28"
      TIMING_NORMAL_MAX: "95"

      # Long stable OOS: reduce load further.
      TIMING_STABLE_MIN: "50"
      TIMING_STABLE_MAX: "130"

      # Backend/SKU signal: temporarily faster, but still non-periodic.
      TIMING_BURST_MIN: "18"
      TIMING_BURST_MAX: "48"

      # Rare longer idle only during ordinary/stable OOS; never during burst.
      TIMING_IDLE_CHANCE: "0.08"
      TIMING_IDLE_MULT_MIN: "1.35"
      TIMING_IDLE_MULT_MAX: "1.90"

      # Product-search is lighter than page HTML and keeps SKU fresh.
      DISCOVERY_EVERY_CHECKS: "3"
      PAGE_EVERY_CHECKS: "7"

    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4

      - name: Watch NVIDIA Spain RTX 5090 FE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 adaptive_runner.py

      - name: Start replacement watcher
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/rtx5090-watch.yml/dispatches" \
            -d '{"ref":"main"}'
