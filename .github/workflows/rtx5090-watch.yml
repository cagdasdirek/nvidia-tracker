name: RTX 5090 FE Spain Watch

on:
  push:
    branches: [main]
  schedule:
    # GitHub cron is only a watchdog. It can be delayed under load, so the
    # workflow also self-dispatches at the end of every run for near-continuous
    # coverage. Offset from :00 because GitHub documents higher schedule load
    # around the start of the hour.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  # At most one live watcher plus one queued replacement. A cron watchdog and
  # self-dispatch may race; concurrency prevents duplicate polling jobs.
  group: rtx-5090-fe-spain-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      # Ten inventory checks 30 seconds apart = ~4.5 minutes of live polling.
      # A replacement workflow is dispatched immediately afterward.
      CHECKS_PER_RUN: "10"
      CHECK_INTERVAL_SECONDS: "30"

      # Refresh NVIDIA's product-search API once per minute so a SKU rotation
      # immediately becomes the SKU used by the inventory poller.
      DISCOVERY_EVERY_CHECKS: "2"

      # The product HTML is a heavier/less authoritative fallback; inspect it
      # once per run while the APIs do the fast path.
      PAGE_EVERY_CHECKS: "10"

    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4

      - name: Watch NVIDIA Spain RTX 5090 FE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tracker.py

      - name: Start replacement watcher
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/rtx5090-watch.yml/dispatches" \
            -d '{"ref":"main"}'
