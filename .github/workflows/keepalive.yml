name: Keep RTX tracker scheduled workflows alive

on:
  schedule:
    # Public repositories can have scheduled workflows disabled after 60 days
    # without repository activity. Create a tiny monthly heartbeat commit.
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record monthly heartbeat
        run: |
          printf 'Last scheduled-workflow heartbeat: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .tracker-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tracker-heartbeat
          git commit -m "chore: keep stock watcher active" || exit 0
          git push
