name: Temp Wallapop Pro CRT Deep Search
on:
  push:
    branches:
      - temp-wallapop-fetch
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Search pro CRT models
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/deep.py <<'PY'
          import json, subprocess, urllib.parse, re, time
          queries=[
            "PVM 2054QM","PVM 2010QM","PVM 2030","PVM 2044QM","PVM 2130QM","PVM 2730QM","PVM 2950QM",
            "PVM 20M2E","PVM 20M4E","PVM 20L2","PVM 20L4","PVM 20L5","PVM 20N6E","PVM 20N5E",
            "PVM 1454QM","PVM 1444QM","PVM 14M2E","PVM 14M4E","PVM 14L2","PVM 14L4","PVM 14N6E",
            "BVM 20F1E","BVM D20F1E","BVM 20","Sony Cube monitor",
            "JVC TM-H1750CG","JVC TM-H1950CG","JVC TM-H150CG","JVC TM-H1700G","JVC broadcast monitor CRT",
            "Ikegami HTM CRT","Ikegami monitor CRT","Barco monitor CRT","Panasonic BT-H CRT",
            "Sony KV-29LS30E","Sony KV-29X5E","Sony KV-29FX30E","Sony KV-25 Trinitron RGB",
            "Commodore 1084S","Philips CM8833"
          ]
          base='https://api.wallapop.com/api/v3/search'
          seen={}
          for q in queries:
            params={'step':1,'source':'keywords','limit':40,'keywords':q,'latitude':40.4168,'longitude':-3.7038,'distance':800000}
            url=base+'?'+urllib.parse.urlencode(params)
            try:
              txt=subprocess.check_output(['curl','--fail','--silent','--show-error','--location','-H','Host: api.wallapop.com','-H','X-DeviceOS: 0',url],text=True)
              d=json.loads(txt)
            except Exception:
              continue
            arr=((((d.get('data') or {}).get('section') or {}).get('payload') or {}).get('items') or [])
            for it in arr:
              if (it.get('location') or {}).get('country_code')!='ES': continue
              iid=it.get('id')
              if not iid: continue
              r=seen.setdefault(iid,it.copy())
              r.setdefault('_queries',[])
              if q not in r['_queries']: r['_queries'].append(q)
            time.sleep(.05)
          # likely monitors only
          out=[]
          for it in seen.values():
            t=((it.get('title') or '')+' '+(it.get('description') or '')).lower()
            if any(x in t for x in ['pvm','bvm','tm-h','ikegami','barco','bt-h','trinitron','1084','cm8833','broadcast']):
              title=(it.get('title') or '').lower()
              if not any(x in title for x in ['manual','cable','tarjeta','botonera','poster','funko','adaptador','batería','bateria']):
                out.append(it)
          out.sort(key=lambda x:((x.get('price') or {}).get('amount') or 99999))
          print('COUNT',len(out))
          for n,it in enumerate(out,1):
            print('ITEM',n,'PRICE',(it.get('price') or {}).get('amount'),'CITY',(it.get('location') or {}).get('city'),
                  'TITLE',it.get('title'),'SLUG',it.get('web_slug'),'Q',','.join(it.get('_queries',[])))
          open('deep.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          python3 /tmp/deep.py
          tar -czf deep.tgz deep.json
      - uses: actions/upload-artifact@v4
        with:
          name: wallapop-deep-search
          path: deep.tgz
