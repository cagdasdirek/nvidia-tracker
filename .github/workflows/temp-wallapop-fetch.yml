name: Temp Wallapop Fetch
on:
  push:
    branches:
      - temp-wallapop-fetch

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Search Wallapop and fetch exact listing images
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out

          Q='Monitor Sony Triniton profesional Vintage'
          URL='https://api.wallapop.com/api/v3/search'

          python3 - <<'PY' > /tmp/query.txt
          import urllib.parse
          print(urllib.parse.urlencode({
              'step':1,
              'source':'keywords',
              'limit':40,
              'keywords':'Monitor Sony Triniton profesional Vintage',
              'min_sale_price':250,
              'max_sale_price':280,
              'latitude':41.6488,
              'longitude':-0.8891,
              'distance':200000,
          }))
          PY
          QS="$(cat /tmp/query.txt)"

          echo "SEARCH_URL=$URL?$QS"
          curl --show-error --location \
            -H 'Host: api.wallapop.com' \
            -H 'X-DeviceOS: 0' \
            "$URL?$QS" -o out/search.json -w '\nHTTP=%{http_code}\n'

          echo '--- response head ---'
          head -c 2000 out/search.json || true
          echo

          python3 - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('out/search.json')
          d=json.loads(p.read_text())
          items = (((d.get('data') or {}).get('section') or {}).get('payload') or {}).get('items') or []
          print('ITEM_COUNT:', len(items))
          target=None
          for it in items:
              print('CANDIDATE:', it.get('id'), it.get('title'), it.get('price'), it.get('location'), it.get('web_slug'))
              if it.get('web_slug') == 'monitor-sony-vintage-1119238065':
                  target=it
                  break
              title=(it.get('title') or '').lower()
              if 'triniton' in title and 'profesional' in title and (it.get('price') or {}).get('amount') == 269:
                  target=it
          if not target:
              raise SystemExit('TARGET_NOT_FOUND')
          pathlib.Path('out/target.json').write_text(json.dumps(target, ensure_ascii=False, indent=2))
          print('TARGET_ID:', target.get('id'))
          print('TARGET_TITLE:', target.get('title'))
          print('TARGET_DESC:', target.get('description'))
          print('TARGET_PRICE:', target.get('price'))
          imgs=target.get('images') or []
          print('IMAGE_COUNT:', len(imgs))
          urls=[]
          for n,img in enumerate(imgs,1):
              u=((img.get('urls') or {}).get('big') or (img.get('urls') or {}).get('medium') or (img.get('urls') or {}).get('small'))
              print(f'IMAGE_{n}: {u}')
              if u: urls.append(u)
          pathlib.Path('out/image_urls.txt').write_text('\n'.join(urls))
          PY

          i=1
          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "$url" ] && continue
            echo "Downloading image $i"
            curl --fail --show-error --location "$url" -o "out/image_$i.jpg"
            file "out/image_$i.jpg" || true
            i=$((i+1))
          done < out/image_urls.txt

          ls -lah out
          tar -czf wallapop-images.tgz -C out .

      - name: Upload fetched images
        uses: actions/upload-artifact@v4
        with:
          name: wallapop-images
          path: wallapop-images.tgz
          if-no-files-found: error
