name: Push notification test

on:
  push:
    paths:
      - '.github/workflows/push-notification-test.yml'

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Create bot-authored test issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          payload = {
              'title': '🚨 BOT TEST — RTX 5090 FE IN STOCK notification',
              'body': '@cagdasdirek **BOT TEST NOTIFICATION** — this issue was created by GitHub Actions, matching the real stock-alert path.',
              'assignees': ['cagdasdirek'],
          }
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues',
              data=json.dumps(payload).encode(),
              method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'github-actions-notification-test',
              },
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              print(r.read().decode())
          PY
